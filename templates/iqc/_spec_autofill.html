{# RAM / Hard Drive autofill (2026-11-24), shared by Register Device and
   Device Edit. Inputs carry data-spec="<field name>". #}
<script>
/* RAM / Hard Drive autofill (2026-11-24, Pankaj): fill RAM or Total RAM Size
   (one size, or several parts split by "," or "+") and the other two fill in.
   Same for Hard Drive. Counts start at 0. Only empty fields (or a 0 count), or fields this script filled, are
   changed; anything typed by hand is kept. Same rules as utils/device_spec. */
(function(){
  var SIZED = /(\d+(?:\.\d+)?)\s*(TB|GB|T|G)(?![A-Za-z])/i, NUM = /^\s*\d+(?:\.\d+)?\s*$/;
  function parts(v){
    var out = [];
    (v || '').split(/[,+]/).forEach(function(p){
      var m = p.match(SIZED);
      if (m) out.push(parseFloat(m[1]) * (/^t/i.test(m[2]) ? 1024 : 1));
      else if (NUM.test(p)) out.push(parseFloat(p));
    });
    return out;
  }
  function gbText(n){
    n = Math.round(n || 0); if (!n) return '';
    if (n >= 1024 && n % 1024 === 0) return (n / 1024) + ' TB';
    if (n >= 1000 && n % 1000 === 0) return (n / 1000) + ' TB';
    return n + ' GB';
  }
  function spaced(v){
    v = (v || '').trim();
    if (NUM.test(v)) return parseFloat(v) + ' GB';
    if (v.indexOf('_') >= 0 || v.indexOf(',') >= 0) return v;
    return v.replace(/(\d+(?:\.\d+)?)\s*(GB|TB)\b/gi, function(_, n, u){ return n + ' ' + u.toUpperCase(); });
  }
  function el(n){ return document.querySelector('[data-spec="' + n + '"]'); }
  function put(n, v){
    var f = el(n); if (!f) return;
    if (f.value.trim() && f.value.trim() !== '0' && f.dataset.auto !== '1') return;   // typed by hand: keep (a count of 0 = not filled yet)
    f.value = v || ''; f.dataset.auto = v ? '1' : '';
  }
  // sum = the total box (RAM / Hard Drive); extra = an optional summary box
  // (Device Edit's Total RAM / Hard Drive Summary), filled with the total too.
  function wire(sum, size, count, extra){
    var s = el(sum), z = el(size), c = el(count), x = extra ? el(extra) : null;
    if (!s || !z || !c) return;
    function total(p){ return gbText(p.reduce(function(a, b){ return a + b; }, 0)); }
    s.addEventListener('input', function(){
      s.dataset.auto = '';
      var p = parts(s.value);
      if (!p.length) { put(size, ''); put(count, '0'); if (x) put(extra, ''); return; }
      put(size, p.length > 1 ? p.map(gbText).join(', ') : spaced(s.value));
      put(count, String(p.length));
      if (x) put(extra, total(p));
    });
    z.addEventListener('input', function(){
      z.dataset.auto = '';
      var p = parts(z.value);
      if (!p.length) { put(sum, ''); put(count, '0'); if (x) put(extra, ''); return; }
      put(sum, total(p));
      put(count, String(p.length));
      if (x) put(extra, total(p));
    });
    c.addEventListener('input', function(){ c.dataset.auto = ''; });
    if (x) x.addEventListener('input', function(){ x.dataset.auto = ''; });
  }
  if (el('ram_gb')) {            // Device Edit: RAM / Hard Drive are the GB boxes
    wire('ram_gb', 'total_ram_size', 'total_ram_count', 'ram_summary');
    wire('storage_gb', 'total_hdd_size', 'total_hdd_count', 'hdd_summary');
  } else {                       // Register Device: RAM / Hard Drive are the summaries
    wire('ram_summary', 'total_ram_size', 'total_ram_count');
    wire('hdd_summary', 'total_hdd_size', 'total_hdd_count');
  }
  window.iqcSpecParts = parts; window.iqcGbText = gbText;     // for tests / console
})();
</script>
