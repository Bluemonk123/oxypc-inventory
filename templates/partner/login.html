<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dealer Login — OxyPC Trade Partner</title>
  <link rel="manifest" href="/static/partner/manifest.json">
  <meta name="theme-color" content="#1f3864">
  <link rel="apple-touch-icon" href="/static/partner/icon-192.png">
  <link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.css">
  <style>
    body { background: #0f1923; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .login-card { width: 100%; max-width: 380px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .login-header { background: linear-gradient(135deg, #0377c2 0%, #0e3a7a 100%); padding: 2rem; text-align: center; }
    .login-body { background: #fff; padding: 2rem; }
    .brand-icon { font-size: 3rem; color: #fff; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <div class="brand-icon"><i class="bi bi-shop"></i></div>
    <h3 class="text-white fw-bold mt-2 mb-0">OxyPC Trade Partner</h3>
    <small class="text-white-50">Dealer Buying Portal</small>
  </div>
  <div class="login-body">
    {% if error %}
    <div class="alert alert-danger py-2 mb-3"><i class="bi bi-exclamation-circle me-2"></i>{{ error }}</div>
    {% endif %}
    <form action="/partner/login" method="post">
      <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Mobile Number</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-phone"></i></span>
          <input type="tel" name="phone" class="form-control" placeholder="10-digit mobile" inputmode="numeric" autocomplete="tel" autofocus required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" id="partnerPassword" name="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required>
          <button type="button" class="btn btn-outline-secondary" id="togglePartnerPassword" tabindex="-1" title="Show/hide password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>
    <p class="text-center text-muted small mt-3 mb-0">Contact your OxyPC sales owner for access</p>
  </div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/partner/sw.js').catch(function () {});
}
document.getElementById('togglePartnerPassword').addEventListener('click', function () {
  var pw = document.getElementById('partnerPassword');
  var icon = this.querySelector('i');
  var showing = pw.type === 'text';
  pw.type = showing ? 'password' : 'text';
  icon.classList.toggle('bi-eye', showing);
  icon.classList.toggle('bi-eye-slash', !showing);
});
</script>
</body>
</html>
