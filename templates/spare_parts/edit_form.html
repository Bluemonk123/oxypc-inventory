{% extends "base.html" %}
{% block title %}Edit Part — OxyPC{% endblock %}
{% block page_title %}Edit Spare Part{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-9">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-transparent fw-semibold"><i class="bi bi-pencil me-2"></i>Edit: {{ part.part_code }} — {{ part.name }}</div>
      <div class="card-body">
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        {% include "spare_parts/_edit_part_form.html" %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
