{# New ticket modal (agent), shared by All Tickets and Dashboard (2026-11-13).
   Needs: all_users, groups, PRIORITIES, TYPES. Button: data-bs-target="#tbNewModal". #}
{% if can(current_user, 'ticket_board', 'add') %}
<div class="modal fade" id="tbNewModal" tabindex="-1" aria-labelledby="tbNewTitle">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <form class="modal-content" method="post" action="/ticket-board/new">
      <input type="hidden" name="csrf_token" value="{{ request.cookies.get('csrf_token', '') }}">
      <div class="modal-header"><h6 class="modal-title fw-semibold" id="tbNewTitle"><i class="bi bi-plus-circle me-2"></i>New ticket</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold" for="tbReqUser">Requester (user)</label>
            <select name="requester_username" id="tbReqUser" class="form-select form-select-sm" data-search>
              <option value="">— Not a user (type below) —</option>
              {% for u, n, e in all_users %}<option value="{{ u }}" data-email="{{ e or '' }}">{{ n or u }} ({{ u }})</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-3" id="tbReqNameWrap">
            <label class="form-label small fw-semibold" for="tbReqName">Requester name</label>
            <input name="requester_name" id="tbReqName" class="form-control form-control-sm" maxlength="50" placeholder="e.g. Anjali Mehta">
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-semibold" for="tbReqEmail">Requester email</label>
            <input name="requester_email" id="tbReqEmail" type="email" class="form-control form-control-sm" maxlength="150" placeholder="name@company.com">
          </div>
          <div class="col-12">
            <label class="form-label small fw-semibold" for="tbSubj">Subject</label>
            <input name="subject" id="tbSubj" class="form-control form-control-sm" maxlength="200" required placeholder="Short summary of the issue">
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold" for="tbPrio">Priority</label>
            <select name="priority" id="tbPrio" class="form-select form-select-sm">
              {% for p in PRIORITIES %}<option value="{{ p }}"{% if p == 'normal' %} selected{% endif %}>{{ p|capitalize }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold" for="tbType">Type</label>
            <select name="ticket_type" id="tbType" class="form-select form-select-sm">
              {% for ty in TYPES %}<option value="{{ ty }}">{{ ty|capitalize }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold" for="tbGroup">Group</label>
            <select name="group_name" id="tbGroup" class="form-select form-select-sm">
              {% for g in groups %}<option value="{{ g }}"{% if g == 'Support' %} selected{% endif %}>{{ g }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-12">
            <label class="form-label small fw-semibold" for="tbDesc">Description</label>
            <textarea name="description" id="tbDesc" class="form-control form-control-sm" rows="5" maxlength="5000" required placeholder="Describe the issue…"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-sm btn-primary">Create ticket</button>
      </div>
    </form>
  </div>
</div>
{% endif %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  var ru = document.getElementById('tbReqUser');
  if (ru) {
    var nameWrap = document.getElementById('tbReqNameWrap'), name = document.getElementById('tbReqName'), em = document.getElementById('tbReqEmail');
    var sync = function () {
      var picked = !!ru.value; nameWrap.style.display = picked ? 'none' : ''; name.required = !picked;
      if (picked) em.value = ru.selectedOptions[0].dataset.email || '';
    };
    ru.addEventListener('change', sync); sync();
  }
});
</script>
